[platformio]
default_envs = m5paper

[env:m5paper]
platform = espressif32@^6.11.0
; M5Unified uses the M5Stack FIRE definition for the original ESP32 M5Paper.
; The library detects the attached M5Paper display and peripherals at runtime.
board = m5stack-fire
framework = arduino
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified@^0.2.12
